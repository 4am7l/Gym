<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نظام إدارة أيرون كور جيم</title>
  
  <!-- الخطوط والأيقونات -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* variables & Themes */
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #0f172a 100%);
      --surface-glass: rgba(30, 41, 59, 0.65);
      --surface-glass-hover: rgba(51, 65, 85, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-border-glow: rgba(99, 102, 241, 0.3);
      
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --accent-neon: #10b981;
      --accent-gradient: linear-gradient(135deg, #34d399 0%, #059669 100%);
      --warning-gradient: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      --danger-gradient: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
      
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --nav-height: 75px;
      --border-radius-lg: 24px;
      --border-radius-md: 16px;
      --border-radius-sm: 12px;
    }

    /* Reset System */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* خلفية متدرجة مضيئة لجمالية الشاشة */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: 5%;
      left: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* الهيدر الأنيق */
    header {
      padding: 18px 22px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      border-bottom-left-radius: var(--border-radius-lg);
      border-bottom-right-radius: var(--border-radius-lg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .location-badge {
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* الحاوية الرئيسية والتنقل المحاكي للتطبيق */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: calc(var(--nav-height) + 35px);
      -webkit-overflow-scrolling: touch;
      z-index: 10;
    }

    main::-webkit-scrollbar { display: none; }

    /* شبكة كروت الإحصائيات الفخمة */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: radial-gradient(circle at top right, rgba(255,255,255,0.05), transparent 70%);
      pointer-events: none;
    }

    .stat-card .icon-box {
      width: 40px;
      height: 40px;
      border-radius: var(--border-radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .stat-card.members .icon-box { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .stat-card.active .icon-box { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .stat-card.expiring .icon-box { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .stat-card.expired .icon-box { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    .stat-card .val {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1;
    }

    .stat-card .lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* العناوين والبحث */
    .section-header {
      font-size: 1.05rem;
      font-weight: 800;
      margin: 20px 0 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    .search-bar {
      width: 100%;
      margin-bottom: 16px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 14px 18px;
      padding-right: 48px;
      border-radius: var(--border-radius-md);
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.3s ease;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
    }

    .search-bar i {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* كروت القوائم بكيرفات ناعمة */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .glass-item-card {
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-md);
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }

    .glass-item-card:active {
      transform: scale(0.98);
      background: var(--surface-glass-hover);
    }

    .meta-details {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .meta-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .meta-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* شارات التمييز الناعمة */
    .status-pill {
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill.Active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-pill.Expiring { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .status-pill.Expired { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    .status-pill.NoSub { background: rgba(156, 163, 175, 0.15); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.3); }

    /* الأزرار التفاعلية المصغرة */
    .action-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--border-radius-sm);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .action-btn.edit { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .action-btn.renew { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .action-btn.delete { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    /* شريط التصفح السفلي (Mobile Navigation Bar) */
    nav.app-navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
      border-top-left-radius: var(--border-radius-lg);
      border-top-right-radius: var(--border-radius-lg);
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      width: 33%;
      transition: all 0.25s ease;
    }

    .nav-tab i { font-size: 1.3rem; transition: transform 0.2s ease; }
    .nav-tab.active { color: var(--primary); font-weight: 800; }
    .nav-tab.active i { transform: translateY(-3px); }

    /* زر الإضافة العائم FAB */
    .fab-trigger {
      position: fixed;
      bottom: calc(var(--nav-height) + 18px);
      left: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
      border: none;
      cursor: pointer;
      z-index: 90;
      transition: transform 0.2s ease;
    }

    .fab-trigger:active { transform: scale(0.9); }

    /* النوافذ العائمة (Modals) بكيرف دائري ناعم */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .modal-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-field label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-field input, .form-field select, .form-field textarea {
      padding: 12px 16px;
      border-radius: var(--border-radius-sm);
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: white;
      outline: none;
      font-size: 0.95rem;
    }

    .form-field input:focus, .form-field select:focus {
      border-color: var(--primary);
    }

    .submit-btn {
      padding: 14px;
      border-radius: var(--border-radius-md);
      background: var(--primary-gradient);
      color: white;
      border: none;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
      margin-top: 8px;
    }

    .page-section { display: none; }
    .page-section.active { display: block; animation: pageSlide 0.25s ease; }

    @keyframes pageSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- هيدر التطبيق العلوي -->
  <header>
    <div class="brand-logo">
      <div class="brand-icon"><i class="fa-solid fa-dumbbell"></i></div>
      <h1>أيرون كور جيم</h1>
    </div>
    <div class="location-badge">
      <i class="fa-solid fa-location-dot" style="color: #6366f1;"></i> عمان
    </div>
  </header>

  <!-- الجسم الرئيسي لشبكة الصفحات -->
  <main>
    
    <!-- 1. الشاشة الرئيسية Dashboard -->
    <section id="page-dashboard" class="page-section active">
      <div class="stats-grid">
        <div class="stat-card members">
          <div class="icon-box"><i class="fa-solid fa-users"></i></div>
          <div class="val" id="stat-members">0</div>
          <div class="lbl">إجمالي المشتركين</div>
        </div>
        <div class="stat-card active">
          <div class="icon-box"><i class="fa-solid fa-bolt"></i></div>
          <div class="val" id="stat-active">0</div>
          <div class="lbl">اشتراكات سارية</div>
        </div>
        <div class="stat-card expiring">
          <div class="icon-box"><i class="fa-solid fa-hourglass-half"></i></div>
          <div class="val" id="stat-expiring">0</div>
          <div class="lbl">تنتهي قريباً</div>
        </div>
        <div class="stat-card expired">
          <div class="icon-box"><i class="fa-solid fa-circle-exclamation"></i></div>
          <div class="val" id="stat-expired">0</div>
          <div class="lbl">منتهية</div>
        </div>
      </div>

      <div class="section-header">آخر النشاطات والاشتراكات</div>
      <div class="cards-list" id="recent-subscriptions-list"></div>
    </section>

    <!-- 2. شاشة الأعضاء Members -->
    <section id="page-members" class="page-section">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="member-search" placeholder="ابحث بالإسم أو رقم الهاتف..." oninput="filterMembers()">
      </div>
      <div class="cards-list" id="all-members-list"></div>
    </section>

    <!-- 3. شاشة الخطط والرياضات Plans -->
    <section id="page-plans" class="page-section">
      <div class="section-header">
        <span>الخطط والرياضات المتاحة</span>
        <button class="status-pill Active" onclick="openPlanModal()" style="border:none; cursor:pointer;">+ خطة جديدة</button>
      </div>
      <div class="cards-list" id="all-plans-list"></div>
    </section>

  </main>

  <!-- زر إضافة مشترك سريع عائم -->
  <button class="fab-trigger" onclick="openMemberModal()"><i class="fa-solid fa-plus"></i></button>

  <!-- شريط الموبايل السفلي للأقسام -->
  <nav class="app-navbar">
    <div class="nav-tab active" onclick="switchTab('dashboard', this)">
      <i class="fa-solid fa-chart-pie"></i>
      <span>الرئيسية</span>
    </div>
    <div class="nav-tab" onclick="switchTab('members', this)">
      <i class="fa-solid fa-id-card"></i>
      <span>الأعضاء</span>
    </div>
    <div class="nav-tab" onclick="switchTab('plans', this)">
      <i class="fa-solid fa-layer-group"></i>
      <span>الخطط</span>
    </div>
  </nav>

  <!-- Modal 1: إضافة وتعديل عضو -->
  <div class="modal-overlay" id="member-modal">
    <div class="modal-card">
      <div class="modal-card-header">
        <span id="member-modal-title">إضافة مشترك جديد</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('member-modal')"></i>
      </div>
      <form id="member-form" onsubmit="handleMemberSubmit(event)">
        <input type="hidden" id="member-id">
        <div class="form-field">
          <label>اسم المشترك</label>
          <input type="text" id="member-name" required placeholder="مثال: محمد علي">
        </div>
        <div class="form-field">
          <label>رقم الهاتف</label>
          <input type="tel" id="member-phone" required placeholder="079XXXXXXXX">
        </div>
        <div class="form-field">
          <label>ملاحظات إضافية</label>
          <textarea id="member-notes" rows="2" placeholder="أية تفاصيل اختيارية..."></textarea>
        </div>
        <div class="form-field" id="plan-select-group">
          <label>خطة الاشتراك (اختياري)</label>
          <select id="member-plan"></select>
        </div>
        <div class="form-field" id="date-select-group">
          <label>تاريخ بدء الاشتراك</label>
          <input type="date" id="member-start-date">
        </div>
        <button type="submit" class="submit-btn">حفظ وتأكيد البيانات</button>
      </form>
    </div>
  </div>

  <!-- Modal 2: تجديد اشتراك عضو -->
  <div class="modal-overlay" id="renew-modal">
    <div class="modal-card">
      <div class="modal-card-header">
        <span>تجديد اشتراك العضو</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('renew-modal')"></i>
      </div>
      <form id="renew-form" onsubmit="handleRenewSubmit(event)">
        <input type="hidden" id="renew-member-id">
        <div class="form-field">
          <label>اختر الخطة الرياضية</label>
          <select id="renew-plan-id" required></select>
        </div>
        <div class="form-field">
          <label>تاريخ البدء</label>
          <input type="date" id="renew-start-date" required>
        </div>
        <button type="submit" class="submit-btn">تجديد الاشتراك فوراً</button>
      </form>
    </div>
  </div>

  <!-- Modal 3: إضافة تعديل خطة -->
  <div class="modal-overlay" id="plan-modal">
    <div class="modal-card">
      <div class="modal-card-header">
        <span id="plan-modal-title">إضافة خطة جديدة</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('plan-modal')"></i>
      </div>
      <form id="plan-form" onsubmit="handlePlanSubmit(event)">
        <input type="hidden" id="plan-id">
        <div class="form-field">
          <label>اسم الخطة / الرياضة</label>
          <input type="text" id="plan-name" required placeholder="مثال: كمال أجسام">
        </div>
        <div class="form-field">
          <label>السعر (بالدينار الأردني)</label>
          <input type="number" id="plan-price" required step="0.5" placeholder="15">
        </div>
        <div class="form-field">
          <label>المدة (بالأيام)</label>
          <input type="number" id="plan-duration" required value="30">
        </div>
        <button type="submit" class="submit-btn">حفظ الخطة</button>
      </form>
    </div>
  </div>

  <script>
    let globalMembers = [];
    let globalPlans = [];

    function switchTab(pageId, element) {
      document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active');
      element.classList.add('active');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function loadAllData() {
      await loadDashboard();
      await loadMembers();
      await loadPlans();
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/dashboard/stats');
        const data = await res.json();
        document.getElementById('stat-members').innerText = data.totalMembers || 0;
        document.getElementById('stat-active').innerText = data.totalActive || 0;
        document.getElementById('stat-expiring').innerText = data.totalExpiring || 0;
        document.getElementById('stat-expired').innerText = data.totalExpired || 0;

        const container = document.getElementById('recent-subscriptions-list');
        container.innerHTML = '';
        (data.recentSubscriptions || []).forEach(s => {
          container.innerHTML += `
            <div class="glass-item-card">
              <div class="meta-details">
                <div class="meta-title">${s.member_name}</div>
                <div class="meta-sub"><i class="fa-solid fa-tag"></i> ${s.plan_name} - ${s.price} د.أ</div>
              </div>
              <span class="status-pill ${s.status}">${s.status === 'Active' ? 'نشط' : (s.status === 'Expiring Soon' ? 'قريب الانتهاء' : 'منتهي')}</span>
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    }

    async function loadMembers() {
      try {
        const res = await fetch('/api/members');
        globalMembers = await res.json();
        renderMembers(globalMembers);
      } catch (e) { console.error(e); }
    }

    function renderMembers(list) {
      const container = document.getElementById('all-members-list');
      container.innerHTML = '';
      list.forEach(m => {
        const statusClass = m.status === 'Active' ? 'Active' : (m.status === 'Expiring Soon' ? 'Expiring' : (m.status === 'Expired' ? 'Expired' : 'NoSub'));
        const statusText = m.status === 'Active' ? 'نشط' : (m.status === 'Expiring Soon' ? 'قريب الانتهاء' : (m.status === 'Expired' ? 'منتهي' : 'بدون اشتراك'));
        
        container.innerHTML += `
          <div class="glass-item-card">
            <div class="meta-details">
              <div class="meta-title">${m.full_name}</div>
              <div class="meta-sub"><i class="fa-solid fa-phone"></i> ${m.phone}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="status-pill ${statusClass}">${statusText}</span>
              <div class="action-group">
                <button class="action-btn renew" onclick="openRenewModal(${m.id})"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="action-btn edit" onclick="editMember(${m.id})"><i class="fa-solid fa-pen"></i></button>
                <button class="action-btn delete" onclick="deleteMember(${m.id})"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterMembers() {
      const q = document.getElementById('member-search').value.toLowerCase();
      const filtered = globalMembers.filter(m => m.full_name.toLowerCase().includes(q) || m.phone.includes(q));
      renderMembers(filtered);
    }

    async function loadPlans() {
      try {
        const res = await fetch('/api/plans');
        globalPlans = await res.json();
        const container = document.getElementById('all-plans-list');
        const select = document.getElementById('member-plan');
        const renewSelect = document.getElementById('renew-plan-id');
        
        container.innerHTML = '';
        select.innerHTML = '<option value="">-- اختر الخطة --</option>';
        renewSelect.innerHTML = '<option value="">-- اختر الخطة --</option>';

        globalPlans.forEach(p => {
          container.innerHTML += `
            <div class="glass-item-card">
              <div class="meta-details">
                <div class="meta-title">${p.name}</div>
                <div class="meta-sub"><i class="fa-solid fa-calendar-days"></i> ${p.duration_days} يوم</div>
              </div>
              <div style="display:flex; align-items:center; gap:12px;">
                <div style="font-weight:800; color:var(--accent-neon);">${p.price} د.أ</div>
                <button class="action-btn delete" onclick="deletePlan(${p.id})"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          `;
          const opt = `<option value="${p.id}">${p.name} (${p.price} د.أ)</option>`;
          select.innerHTML += opt;
          renewSelect.innerHTML += opt;
        });
      } catch (e) { console.error(e); }
    }

    function openMemberModal() {
      document.getElementById('member-id').value = '';
      document.getElementById('member-form').reset();
      document.getElementById('member-modal-title').innerText = 'إضافة مشترك جديد';
      document.getElementById('plan-select-group').style.display = 'flex';
      document.getElementById('date-select-group').style.display = 'flex';
      document.getElementById('member-start-date').valueAsDate = new Date();
      document.getElementById('member-modal').classList.add('active');
    }

    function editMember(id) {
      const m = globalMembers.find(x => x.id === id);
      if (!m) return;
      document.getElementById('member-id').value = m.id;
      document.getElementById('member-name').value = m.full_name;
      document.getElementById('member-phone').value = m.phone;
      document.getElementById('member-notes').value = m.notes || '';
      document.getElementById('member-modal-title').innerText = 'تعديل بيانات العضو';
      document.getElementById('plan-select-group').style.display = 'none';
      document.getElementById('date-select-group').style.display = 'none';
      document.getElementById('member-modal').classList.add('active');
    }

    function openRenewModal(memberId) {
      document.getElementById('renew-member-id').value = memberId;
      document.getElementById('renew-start-date').valueAsDate = new Date();
      document.getElementById('renew-modal').classList.add('active');
    }

    function openPlanModal() {
      document.getElementById('plan-id').value = '';
      document.getElementById('plan-form').reset();
      document.getElementById('plan-modal').classList.add('active');
    }

    async function handleMemberSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('member-id').value;
      const body = {
        full_name: document.getElementById('member-name').value,
        phone: document.getElementById('member-phone').value,
        notes: document.getElementById('member-notes').value,
        plan_id: document.getElementById('member-plan').value,
        start_date: document.getElementById('member-start-date').value
      };

      const url = id ? '/api/members/' + id : '/api/members';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('member-modal');
      loadAllData();
    }

    async function handleRenewSubmit(e) {
      e.preventDefault();
      const body = {
        member_id: document.getElementById('renew-member-id').value,
        plan_id: document.getElementById('renew-plan-id').value,
        start_date: document.getElementById('renew-start-date').value
      };

      await fetch('/api/subscriptions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('renew-modal');
      loadAllData();
    }

    async function handlePlanSubmit(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('plan-name').value,
        price: document.getElementById('plan-price').value,
        duration_days: document.getElementById('plan-duration').value,
        active: 1
      };

      await fetch('/api/plans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('plan-modal');
      loadPlans();
    }

    async function deleteMember(id) {
      if (!confirm('هل أنت متأكد من حذف هذا العضو؟')) return;
      await fetch('/api/members/' + id, { method: 'DELETE' });
      loadAllData();
    }

    async function deletePlan(id) {
      if (!confirm('هل أنت متأكد من حذف هذه الخطة؟')) return;
      await fetch('/api/plans/' + id, { method: 'DELETE' });
      loadPlans();
    }

    loadAllData();
  </script>
</body>
</html>
