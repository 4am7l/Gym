<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام أيرون كور جيم الاحترافي</title>
  
  <!-- خط Tajawal والـ FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090a0f;
      --panel-glass: rgba(18, 20, 29, 0.65);
      --card-glass: rgba(255, 255, 255, 0.03);
      --card-glass-hover: rgba(255, 255, 255, 0.07);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(255, 255, 255, 0.15);
      
      --text-bright: #ffffff;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
      
      --accent-white: #ffffff;
      --accent-neon: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-bright);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
    }

    /* Container للكمبيوتر والأجهزة العريضة */
    .app-viewport {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }

    /* الهيدر العلوي بنمط زجاجي متطور Liquid Glass Header */
    header.main-header {
      background: var(--panel-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .brand-title h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    /* زر التفاعل الرئيسي للمستخدم */
    .btn-liquid {
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glow);
      color: var(--text-bright);
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-liquid:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
    }

    /* تخطيط الصفحة الرئيسي للكمبيوتر */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    /* القائمة الجانبية للبيسي Sidebar Navigation */
    aside.sidebar {
      background: var(--panel-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: fit-content;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      color: var(--text-sub);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-link i {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }

    .nav-link:hover {
      background: var(--card-glass-hover);
      color: var(--text-bright);
    }

    .nav-link.active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid var(--border-glow);
      color: var(--text-bright);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* المحتوى الرئيسي للمعلومات */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* شبكة الإحصائيات الفخمة */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .glass-card {
      background: var(--panel-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-3px);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--text-bright);
    }

    .card-value {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .card-label {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* لوحة الجداول والأعضاء الزجاجية */
    .data-panel {
      background: var(--panel-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      font-size: 1.25rem;
      font-weight: 800;
    }

    /* البحث الزجاجي الأنيق */
    .search-input-wrapper {
      position: relative;
      width: 320px;
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 12px 20px 12px 44px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input-wrapper input:focus {
      border-color: var(--border-glow);
      background: rgba(255, 255, 255, 0.07);
    }

    .search-input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    /* قائمة الكروت المنحنية للمعلومات */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .item-card-glass {
      background: var(--card-glass);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .item-card-glass:hover {
      background: var(--card-glass-hover);
      border-color: var(--border-glow);
    }

    .item-info-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* الشارات المنحنية بكيرف زجاجي */
    .badge-curved {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    .badge-curved.Active { background: rgba(74, 222, 128, 0.1); color: var(--accent-green); border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-curved.Expiring { background: rgba(251, 191, 36, 0.1); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-curved.Expired { background: rgba(248, 113, 113, 0.1); color: var(--accent-red); border: 1px solid rgba(248, 113, 113, 0.3); }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .action-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--border-glow);
    }

    /* Modals النوافذ الزجاجية بكيرف عالي */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-backdrop.active {
      display: flex;
      animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-glass-box {
      background: rgba(18, 20, 29, 0.9);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-header-text {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group-custom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group-custom label {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .form-group-custom input, .form-group-custom select, .form-group-custom textarea {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group-custom input:focus {
      border-color: var(--border-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .section-view { display: none; }
    .section-view.active { display: block; animation: sectionFade 0.3s ease; }

    @keyframes sectionFade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* الاستجابة للموبايل تلقائياً Responsive */
    @media (max-width: 900px) {
      .dashboard-layout { grid-template-columns: 1fr; }
      aside.sidebar { flex-direction: row; justify-content: space-around; padding: 12px; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .search-input-wrapper { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- الهيدر العلوي الزجاجي -->
    <header class="main-header">
      <div class="brand-section">
        <div class="brand-icon"><i class="fa-solid fa-dumbbell"></i></div>
        <div class="brand-title">
          <h1>أيرون كور جيم</h1>
          <p>نظام الإدارة الذكي - عمان (الأردن)</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-liquid" onclick="openMemberModal()">
          <i class="fa-solid fa-user-plus"></i> إضافة مشترك جديد
        </button>
      </div>
    </header>

    <!-- التخطيط العام للجيم -->
    <div class="dashboard-layout">
      
      <!-- القائمة الجانبية للتنقل (بيسي وموبايل) -->
      <aside class="sidebar">
        <div class="nav-link active" onclick="switchSection('dashboard', this)">
          <i class="fa-solid fa-chart-pie"></i>
          <span>الرئيسية</span>
        </div>
        <div class="nav-link" onclick="switchSection('members', this)">
          <i class="fa-solid fa-address-book"></i>
          <span>الأعضاء</span>
        </div>
        <div class="nav-link" onclick="switchSection('plans', this)">
          <i class="fa-solid fa-layer-group"></i>
          <span>الخطط والرياضات</span>
        </div>
      </aside>

      <!-- المنطقة الرئيسية للمحتوى -->
      <div class="content-area">
        
        <!-- قسم الداشبورد -->
        <section id="view-dashboard" class="section-view active">
          <div class="stats-row">
            <div class="glass-card">
              <div class="card-icon"><i class="fa-solid fa-users"></i></div>
              <div class="card-value" id="stat-members">0</div>
              <div class="card-label">إجمالي الاعضاء</div>
            </div>
            <div class="glass-card">
              <div class="card-icon" style="color: var(--accent-green);"><i class="fa-solid fa-bolt"></i></div>
              <div class="card-value" id="stat-active">0</div>
              <div class="card-label">اشتراكات سارية</div>
            </div>
            <div class="glass-card">
              <div class="card-icon" style="color: var(--accent-amber);"><i class="fa-solid fa-hourglass-half"></i></div>
              <div class="card-value" id="stat-expiring">0</div>
              <div class="card-label">تنتهي قريباً</div>
            </div>
            <div class="glass-card">
              <div class="card-icon" style="color: var(--accent-red);"><i class="fa-solid fa-circle-exclamation"></i></div>
              <div class="card-value" id="stat-expired">0</div>
              <div class="card-label">منتهية</div>
            </div>
          </div>

          <div style="height: 20px;"></div>

          <div class="data-panel">
            <div class="panel-header">
              <h2>آخر النشاطات والاشتراكات</h2>
            </div>
            <div class="items-grid" id="recent-subscriptions-list"></div>
          </div>
        </section>

        <!-- قسم الأعضاء -->
        <section id="view-members" class="section-view">
          <div class="data-panel">
            <div class="panel-header">
              <h2>سجل الأعضاء الكامل</h2>
              <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="member-search" placeholder="ابحث بالإسم أو الهاتف..." oninput="filterMembers()">
              </div>
            </div>
            <div class="items-grid" id="all-members-list"></div>
          </div>
        </section>

        <!-- قسم الخطط -->
        <section id="view-plans" class="section-view">
          <div class="data-panel">
            <div class="panel-header">
              <h2>الخطط والاشتراكات المتاحة</h2>
              <button class="btn-liquid" onclick="openPlanModal()" style="padding: 8px 16px; font-size: 0.85rem;">
                + إضافة خطة رياضية
              </button>
            </div>
            <div class="items-grid" id="all-plans-list"></div>
          </div>
        </section>

      </div>

    </div>

  </div>

  <!-- Modal: إضافة وتعديل عضو -->
  <div class="modal-backdrop" id="member-modal">
    <div class="modal-glass-box">
      <div class="modal-header-text">
        <span id="member-modal-title">إضافة مشترك جديد</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('member-modal')"></i>
      </div>
      <form id="member-form" onsubmit="handleMemberSubmit(event)">
        <input type="hidden" id="member-id">
        <div class="form-group-custom">
          <label>اسم المشترك</label>
          <input type="text" id="member-name" required placeholder="مثال: محمد علي">
        </div>
        <div class="form-group-custom">
          <label>رقم الهاتف</label>
          <input type="tel" id="member-phone" required placeholder="079XXXXXXXX">
        </div>
        <div class="form-group-custom">
          <label>ملاحظات إضافية</label>
          <textarea id="member-notes" rows="2" placeholder="أية تفاصيل اختيارية..."></textarea>
        </div>
        <div class="form-group-custom" id="plan-select-group">
          <label>خطة الاشتراك (اختياري)</label>
          <select id="member-plan"></select>
        </div>
        <div class="form-group-custom" id="date-select-group">
          <label>تاريخ بدء الاشتراك</label>
          <input type="date" id="member-start-date">
        </div>
        <button type="submit" class="btn-liquid" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ البيانات</button>
      </form>
    </div>
  </div>

  <!-- Modal: تجديد اشتراك -->
  <div class="modal-backdrop" id="renew-modal">
    <div class="modal-glass-box">
      <div class="modal-header-text">
        <span>تجديد اشتراك العضو</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('renew-modal')"></i>
      </div>
      <form id="renew-form" onsubmit="handleRenewSubmit(event)">
        <input type="hidden" id="renew-member-id">
        <div class="form-group-custom">
          <label>اختر الخطة الرياضية</label>
          <select id="renew-plan-id" required></select>
        </div>
        <div class="form-group-custom">
          <label>تاريخ البدء</label>
          <input type="date" id="renew-start-date" required>
        </div>
        <button type="submit" class="btn-liquid" style="width: 100%; justify-content: center; margin-top: 10px;">تجديد الاشتراك فوراً</button>
      </form>
    </div>
  </div>

  <!-- Modal: إضافة خطة جديدة -->
  <div class="modal-backdrop" id="plan-modal">
    <div class="modal-glass-box">
      <div class="modal-header-text">
        <span>إضافة خطة جديدة</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('plan-modal')"></i>
      </div>
      <form id="plan-form" onsubmit="handlePlanSubmit(event)">
        <div class="form-group-custom">
          <label>اسم الخطة / الرياضة</label>
          <input type="text" id="plan-name" required placeholder="مثال: كمال أجسام">
        </div>
        <div class="form-group-custom">
          <label>السعر (بالدينار الأردني)</label>
          <input type="number" id="plan-price" required step="0.5" placeholder="15">
        </div>
        <div class="form-group-custom">
          <label>المدة (بالأيام)</label>
          <input type="number" id="plan-duration" required value="30">
        </div>
        <button type="submit" class="btn-liquid" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ الخطة</button>
      </form>
    </div>
  </div>

  <script>
    let globalMembers = [];
    let globalPlans = [];

    function switchSection(viewId, element) {
      document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');
      element.classList.add('active');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function loadAllData() {
      await loadDashboard();
      await loadMembers();
      await loadPlans();
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/dashboard/stats');
        const data = await res.json();
        document.getElementById('stat-members').innerText = data.totalMembers || 0;
        document.getElementById('stat-active').innerText = data.totalActive || 0;
        document.getElementById('stat-expiring').innerText = data.totalExpiring || 0;
        document.getElementById('stat-expired').innerText = data.totalExpired || 0;

        const container = document.getElementById('recent-subscriptions-list');
        container.innerHTML = '';
        (data.recentSubscriptions || []).forEach(s => {
          container.innerHTML += `
            <div class="item-card-glass">
              <div class="item-info-main">
                <div class="item-name">${s.member_name}</div>
                <div class="item-meta"><i class="fa-solid fa-tag"></i> ${s.plan_name} - ${s.price} د.أ</div>
              </div>
              <span class="badge-curved ${s.status}">${s.status === 'Active' ? 'نشط' : (s.status === 'Expiring Soon' ? 'قريب الانتهاء' : 'منتهي')}</span>
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    }

    async function loadMembers() {
      try {
        const res = await fetch('/api/members');
        globalMembers = await res.json();
        renderMembers(globalMembers);
      } catch (e) { console.error(e); }
    }

    function renderMembers(list) {
      const container = document.getElementById('all-members-list');
      container.innerHTML = '';
      list.forEach(m => {
        const statusClass = m.status === 'Active' ? 'Active' : (m.status === 'Expiring Soon' ? 'Expiring' : (m.status === 'Expired' ? 'Expired' : 'NoSub'));
        const statusText = m.status === 'Active' ? 'نشط' : (m.status === 'Expiring Soon' ? 'قريب الانتهاء' : (m.status === 'Expired' ? 'منتهي' : 'بدون اشتراك'));
        
        container.innerHTML += `
          <div class="item-card-glass">
            <div class="item-info-main">
              <div class="item-name">${m.full_name}</div>
              <div class="item-meta"><i class="fa-solid fa-phone"></i> ${m.phone}</div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="badge-curved ${statusClass}">${statusText}</span>
              <div class="card-actions">
                <button class="action-icon-btn" onclick="openRenewModal(${m.id})" title="تجديد"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="action-icon-btn" onclick="editMember(${m.id})" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                <button class="action-icon-btn" onclick="deleteMember(${m.id})" title="حذف"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterMembers() {
      const q = document.getElementById('member-search').value.toLowerCase();
      const filtered = globalMembers.filter(m => m.full_name.toLowerCase().includes(q) || m.phone.includes(q));
      renderMembers(filtered);
    }

    async function loadPlans() {
      try {
        const res = await fetch('/api/plans');
        globalPlans = await res.json();
        const container = document.getElementById('all-plans-list');
        const select = document.getElementById('member-plan');
        const renewSelect = document.getElementById('renew-plan-id');
        
        container.innerHTML = '';
        select.innerHTML = '<option value="">-- اختر الخطة --</option>';
        renewSelect.innerHTML = '<option value="">-- اختر الخطة --</option>';

        globalPlans.forEach(p => {
          container.innerHTML += `
            <div class="item-card-glass">
              <div class="item-info-main">
                <div class="item-name">${p.name}</div>
                <div class="item-meta"><i class="fa-solid fa-calendar-days"></i> ${p.duration_days} يوم</div>
              </div>
              <div style="display:flex; align-items:center; gap:14px;">
                <div style="font-weight:900; font-size:1.1rem; color:white;">${p.price} د.أ</div>
                <button class="action-icon-btn" onclick="deletePlan(${p.id})"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          `;
          const opt = `<option value="${p.id}">${p.name} (${p.price} د.أ)</option>`;
          select.innerHTML += opt;
          renewSelect.innerHTML += opt;
        });
      } catch (e) { console.error(e); }
    }

    function openMemberModal() {
      document.getElementById('member-id').value = '';
      document.getElementById('member-form').reset();
      document.getElementById('member-modal-title').innerText = 'إضافة مشترك جديد';
      document.getElementById('plan-select-group').style.display = 'flex';
      document.getElementById('date-select-group').style.display = 'flex';
      document.getElementById('member-start-date').valueAsDate = new Date();
      document.getElementById('member-modal').classList.add('active');
    }

    function editMember(id) {
      const m = globalMembers.find(x => x.id === id);
      if (!m) return;
      document.getElementById('member-id').value = m.id;
      document.getElementById('member-name').value = m.full_name;
      document.getElementById('member-phone').value = m.phone;
      document.getElementById('member-notes').value = m.notes || '';
      document.getElementById('member-modal-title').innerText = 'تعديل بيانات العضو';
      document.getElementById('plan-select-group').style.display = 'none';
      document.getElementById('date-select-group').style.display = 'none';
      document.getElementById('member-modal').classList.add('active');
    }

    function openRenewModal(memberId) {
      document.getElementById('renew-member-id').value = memberId;
      document.getElementById('renew-start-date').valueAsDate = new Date();
      document.getElementById('renew-modal').classList.add('active');
    }

    function openPlanModal() {
      document.getElementById('plan-form').reset();
      document.getElementById('plan-modal').classList.add('active');
    }

    async function handleMemberSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('member-id').value;
      const body = {
        full_name: document.getElementById('member-name').value,
        phone: document.getElementById('member-phone').value,
        notes: document.getElementById('member-notes').value,
        plan_id: document.getElementById('member-plan').value,
        start_date: document.getElementById('member-start-date').value
      };

      const url = id ? '/api/members/' + id : '/api/members';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('member-modal');
      loadAllData();
    }

    async function handleRenewSubmit(e) {
      e.preventDefault();
      const body = {
        member_id: document.getElementById('renew-member-id').value,
        plan_id: document.getElementById('renew-plan-id').value,
        start_date: document.getElementById('renew-start-date').value
      };

      await fetch('/api/subscriptions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('renew-modal');
      loadAllData();
    }

    async function handlePlanSubmit(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('plan-name').value,
        price: document.getElementById('plan-price').value,
        duration_days: document.getElementById('plan-duration').value,
        active: 1
      };

      await fetch('/api/plans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('plan-modal');
      loadPlans();
    }

    async function deleteMember(id) {
      if (!confirm('هل أنت متأكد من حذف هذا العضو؟')) return;
      await fetch('/api/members/' + id, { method: 'DELETE' });
      loadAllData();
    }

    async function deletePlan(id) {
      if (!confirm('هل أنت متأكد من حذف هذه الخطة؟')) return;
      await fetch('/api/plans/' + id, { method: 'DELETE' });
      loadPlans();
    }

    loadAllData();
  </script>
</body>
</html>
