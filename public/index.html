<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة أيرون كور جيم</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #090a0f;
      --panel-bg: rgba(18, 20, 29, 0.75);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.08);
      --border-color: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(99, 102, 241, 0.4);
      
      --text-bright: #ffffff;
      --text-sub: #94a3b8;
      
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;

      --select-bg: #1e293b;
      --select-opt-bg: #0f172a;
    }

    body.light-mode {
      --bg-main: #f1f5f9;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --card-bg: rgba(0, 0, 0, 0.03);
      --card-hover: rgba(0, 0, 0, 0.06);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-glow: rgba(99, 102, 241, 0.3);
      
      --text-bright: #0f172a;
      --text-sub: #64748b;
      
      --select-bg: #ffffff;
      --select-opt-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background: var(--bg-main);
      color: var(--text-bright);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .app-viewport {
      max-width: 1350px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }

    header.main-header {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .brand-section { display: flex; align-items: center; gap: 16px; }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--primary-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    .brand-title h1 { font-size: 1.5rem; font-weight: 900; }
    .brand-title p { font-size: 0.85rem; color: var(--text-sub); }

    .header-controls { display: flex; align-items: center; gap: 12px; }

    /* زر الثيم العصري */
    .theme-toggle-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .theme-toggle-btn i { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .theme-toggle-btn:hover i { transform: rotate(360deg) scale(1.15); }

    .btn-liquid {
      background: var(--primary-gradient);
      border: 1px solid var(--border-glow);
      color: white;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
    }

    aside.sidebar {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: fit-content;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      color: var(--text-sub);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .nav-link:hover { background: var(--card-hover); color: var(--text-bright); }
    .nav-link.active {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .content-area { display: flex; flex-direction: column; gap: 24px; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .glass-card {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .card-value { font-size: 2.2rem; font-weight: 900; }
    .card-label { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; }

    .data-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-header { display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { font-size: 1.25rem; font-weight: 800; }

    /* تبويبات الفلترة المخصصة للأعضاء */
    .filter-tabs {
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    /* البطاقات الطولية الكبيرة الأفقية (Horizontal Full Cards) */
    .horizontal-cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .horizontal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .horizontal-card:hover {
      background: var(--card-hover);
      border-color: var(--border-glow);
    }

    .member-info-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 200px;
    }

    .member-name-txt { font-size: 1.15rem; font-weight: 800; }
    .member-phone-txt { font-size: 0.88rem; color: var(--text-sub); }

    .sub-info-col {
      display: flex;
      align-items: center;
      gap: 30px;
      flex: 1;
      justify-content: center;
    }

    .info-sub-item { display: flex; flex-direction: column; gap: 2px; }
    .info-sub-item .lbl { font-size: 0.75rem; color: var(--text-sub); }
    .info-sub-item .val { font-size: 0.92rem; font-weight: 700; }

    .badge-curved {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge-curved.Active { background: rgba(74, 222, 128, 0.15); color: var(--accent-green); border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-curved.Expiring { background: rgba(251, 191, 36, 0.15); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-curved.Expired { background: rgba(248, 113, 113, 0.15); color: var(--accent-red); border: 1px solid rgba(248, 113, 113, 0.3); }

    .card-actions-row { display: flex; gap: 8px; }

    .action-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    /* ألوان الـ Select Options */
    .form-group-custom select {
      background-color: var(--select-bg) !important;
      color: var(--text-bright) !important;
      cursor: pointer;
    }

    .form-group-custom select option {
      background-color: var(--select-opt-bg) !important;
      color: var(--text-bright) !important;
      padding: 12px;
    }

    .form-group-custom select option:hover,
    .form-group-custom select option:focus,
    .form-group-custom select option:checked {
      background-color: var(--primary) !important;
      color: #ffffff !important;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-backdrop.active { display: flex; }

    .modal-glass-box {
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-header-text { font-size: 1.3rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }

    .form-group-custom { display: flex; flex-direction: column; gap: 8px; }
    .form-group-custom label { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; }

    .form-group-custom input, .form-group-custom select, .form-group-custom textarea {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      font-size: 0.95rem;
      outline: none;
    }

    .section-view { display: none; }
    .section-view.active { display: block; }

    @media (max-width: 900px) {
      .dashboard-layout { grid-template-columns: 1fr; }
      aside.sidebar { flex-direction: row; justify-content: space-around; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .horizontal-card { flex-direction: column; align-items: flex-start; gap: 14px; }
      .sub-info-col { flex-wrap: wrap; justify-content: flex-start; gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <header class="main-header">
      <div class="brand-section">
        <div class="brand-icon"><i class="fa-solid fa-dumbbell"></i></div>
        <div class="brand-title">
          <h1>أيرون كور جيم</h1>
          <p>نظام الإدارة الذكي - عمان (الأردن)</p>
        </div>
      </div>
      <div class="header-controls">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="تغيير المود">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
        <button class="btn-liquid" onclick="openMemberModal()">
          <i class="fa-solid fa-user-plus"></i> إضافة مشترك جديد
        </button>
      </div>
    </header>

    <div class="dashboard-layout">
      
      <aside class="sidebar">
        <div class="nav-link active" onclick="switchSection('dashboard', this)">
          <i class="fa-solid fa-chart-pie"></i>
          <span>الرئيسية</span>
        </div>
        <div class="nav-link" onclick="switchSection('members', this)">
          <i class="fa-solid fa-address-book"></i>
          <span>سجل الأعضاء التفصيلي</span>
        </div>
        <div class="nav-link" onclick="switchSection('plans', this)">
          <i class="fa-solid fa-layer-group"></i>
          <span>الخطط والرياضات</span>
        </div>
      </aside>

      <div class="content-area">
        
        <!-- الداشبورد -->
        <section id="view-dashboard" class="section-view active">
          <div class="stats-row">
            <div class="glass-card">
              <div class="card-icon"><i class="fa-solid fa-users"></i></div>
              <div class="card-value" id="stat-members">0</div>
              <div class="card-label">إجمالي المشتركين</div>
            </div>
            <div class="glass-card">
              <div class="card-icon" style="color: var(--accent-green);"><i class="fa-solid fa-bolt"></i></div>
              <div class="card-value" id="stat-active">0</div>
              <div class="card-label">اشتراكات سارية</div>
            </div>
            <div class="glass-card">
              <div class="card-icon" style="color: var(--accent-amber);"><i class="fa-solid fa-hourglass-half"></i></div>
              <div class="card-value" id="stat-expiring">0</div>
              <div class="card-label">تنتهي قريباً</div>
            </div>
            <div class="glass-card">
              <div class="card-icon" style="color: var(--accent-red);"><i class="fa-solid fa-circle-exclamation"></i></div>
              <div class="card-value" id="stat-expired">0</div>
              <div class="card-label">منتهية</div>
            </div>
          </div>

          <div style="height: 20px;"></div>

          <div class="data-panel">
            <div class="panel-header">
              <h2>آخر الاشتراكات المضافة حديثاً</h2>
            </div>
            <div class="horizontal-cards-list" id="recent-subscriptions-list"></div>
          </div>
        </section>

        <!-- سجل الأعضاء التفصيلي بقوائم مفصّلة بطول كامل -->
        <section id="view-members" class="section-view">
          <div class="data-panel">
            <div class="panel-header">
              <h2>سجل الأعضاء والاشتراكات</h2>
              <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterMemberTab('all', this)">الكل</button>
                <button class="tab-btn" onclick="filterMemberTab('Active', this)">🟢 نشطين</button>
                <button class="tab-btn" onclick="filterMemberTab('Expiring Soon', this)">🟡 قربت تنتهي</button>
                <button class="tab-btn" onclick="filterMemberTab('Expired', this)">🔴 منتهية</button>
              </div>
            </div>

            <div class="horizontal-cards-list" id="all-members-list"></div>
          </div>
        </section>

        <!-- الخطط -->
        <section id="view-plans" class="section-view">
          <div class="data-panel">
            <div class="panel-header">
              <h2>الخطط والرياضات المتاحة</h2>
              <button class="btn-liquid" onclick="openPlanModal()" style="padding: 10px 18px; font-size: 0.88rem;">
                + إضافة خطة جديدة
              </button>
            </div>
            <div class="horizontal-cards-list" id="all-plans-list"></div>
          </div>
        </section>

      </div>

    </div>

  </div>

  <!-- Modal: إضافة وتعديل عضو -->
  <div class="modal-backdrop" id="member-modal">
    <div class="modal-glass-box">
      <div class="modal-header-text">
        <span id="member-modal-title">إضافة مشترك جديد</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('member-modal')"></i>
      </div>
      <form id="member-form" onsubmit="handleMemberSubmit(event)">
        <input type="hidden" id="member-id">
        <div class="form-group-custom">
          <label>اسم المشترك الكامل</label>
          <input type="text" id="member-name" required placeholder="مثال: محمد علي">
        </div>
        <div class="form-group-custom">
          <label>رقم الهاتف</label>
          <input type="tel" id="member-phone" required placeholder="079XXXXXXXX">
        </div>
        <div class="form-group-custom">
          <label>ملاحظات إضافية</label>
          <textarea id="member-notes" rows="2" placeholder="أية ملاحظات..."></textarea>
        </div>
        <div class="form-group-custom" id="plan-select-group">
          <label>خطة الاشتراك المعتمدة</label>
          <select id="member-plan"></select>
        </div>
        <div class="form-group-custom" id="date-select-group">
          <label>تاريخ بدء الاشتراك</label>
          <input type="date" id="member-start-date">
        </div>
        <button type="submit" class="btn-liquid" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ وتأكيد البيانات</button>
      </form>
    </div>
  </div>

  <!-- Modal: تجديد اشتراك -->
  <div class="modal-backdrop" id="renew-modal">
    <div class="modal-glass-box">
      <div class="modal-header-text">
        <span>تجديد اشتراك العضو</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('renew-modal')"></i>
      </div>
      <form id="renew-form" onsubmit="handleRenewSubmit(event)">
        <input type="hidden" id="renew-member-id">
        <div class="form-group-custom">
          <label>اختر الخطة الرياضية</label>
          <select id="renew-plan-id" required></select>
        </div>
        <div class="form-group-custom">
          <label>تاريخ بدء الاشتراك الجديد</label>
          <input type="date" id="renew-start-date" required>
        </div>
        <button type="submit" class="btn-liquid" style="width: 100%; justify-content: center; margin-top: 10px;">تأكيد تجديد الاشتراك</button>
      </form>
    </div>
  </div>

  <!-- Modal: إضافة خطة جديدة -->
  <div class="modal-backdrop" id="plan-modal">
    <div class="modal-glass-box">
      <div class="modal-header-text">
        <span>إضافة خطة رياضية</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('plan-modal')"></i>
      </div>
      <form id="plan-form" onsubmit="handlePlanSubmit(event)">
        <div class="form-group-custom">
          <label>اسم الخطة / الرياضة</label>
          <input type="text" id="plan-name" required placeholder="مثال: كمال أجسام">
        </div>
        <div class="form-group-custom">
          <label>السعر (بالدينار الأردني)</label>
          <input type="number" id="plan-price" required step="0.5" placeholder="15">
        </div>
        <div class="form-group-custom">
          <label>مدة الاشتراك (بالأيام)</label>
          <input type="number" id="plan-duration" required value="30">
        </div>
        <button type="submit" class="btn-liquid" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ الخطة</button>
      </form>
    </div>
  </div>

  <script>
    let globalMembers = [];
    let globalPlans = [];
    let currentFilter = 'all';

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('theme-icon').className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    if (localStorage.getItem('theme') === 'light') toggleTheme();

    function switchSection(viewId, element) {
      document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');
      element.classList.add('active');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function loadAllData() {
      await loadDashboard();
      await loadMembers();
      await loadPlans();
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/dashboard/stats');
        const data = await res.json();
        document.getElementById('stat-members').innerText = data.totalMembers || 0;
        document.getElementById('stat-active').innerText = data.totalActive || 0;
        document.getElementById('stat-expiring').innerText = data.totalExpiring || 0;
        document.getElementById('stat-expired').innerText = data.totalExpired || 0;

        const container = document.getElementById('recent-subscriptions-list');
        container.innerHTML = '';
        (data.recentSubscriptions || []).forEach(s => {
          container.innerHTML += `
            <div class="horizontal-card">
              <div class="member-info-col">
                <div class="member-name-txt">${s.member_name}</div>
                <div class="member-phone-txt"><i class="fa-solid fa-phone"></i> ${s.phone || 'غير مسجل'}</div>
              </div>
              <div class="sub-info-col">
                <div class="info-sub-item"><span class="lbl">الخطة</span><span class="val">${s.plan_name}</span></div>
                <div class="info-sub-item"><span class="lbl">السعر</span><span class="val" style="color:var(--accent-green);">${s.price} د.أ</span></div>
                <div class="info-sub-item"><span class="lbl">بدأ في</span><span class="val">${s.start_date}</span></div>
                <div class="info-sub-item"><span class="lbl">ينتهي في</span><span class="val">${s.end_date}</span></div>
              </div>
              <span class="badge-curved ${s.status}">${s.status === 'Active' ? 'نشط' : (s.status === 'Expiring Soon' ? 'قريب الانتهاء' : 'منتهي')}</span>
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    }

    async function loadMembers() {
      try {
        const res = await fetch('/api/members');
        globalMembers = await res.json();
        renderMembers();
      } catch (e) { console.error(e); }
    }

    function filterMemberTab(tab, btn) {
      currentFilter = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMembers();
    }

    function renderMembers() {
      const container = document.getElementById('all-members-list');
      container.innerHTML = '';

      let list = globalMembers;
      if (currentFilter !== 'all') {
        list = globalMembers.filter(m => m.status === currentFilter);
      }

      list.forEach(m => {
        const statusClass = m.status === 'Active' ? 'Active' : (m.status === 'Expiring Soon' ? 'Expiring' : (m.status === 'Expired' ? 'Expired' : 'NoSub'));
        const statusText = m.status === 'Active' ? 'نشط' : (m.status === 'Expiring Soon' ? 'قريب الانتهاء' : (m.status === 'Expired' ? 'منتهي' : 'بدون اشتراك'));
        
        container.innerHTML += `
          <div class="horizontal-card">
            <div class="member-info-col">
              <div class="member-name-txt">${m.full_name}</div>
              <div class="member-phone-txt"><i class="fa-solid fa-phone"></i> ${m.phone}</div>
            </div>
            
            <div class="sub-info-col">
              <div class="info-sub-item"><span class="lbl">الخطة الحالية</span><span class="val">${m.plan_name || 'لا يوجد'}</span></div>
              <div class="info-sub-item"><span class="lbl">تاريخ البدء</span><span class="val">${m.start_date || 'غير محدد'}</span></div>
              <div class="info-sub-item"><span class="lbl">تاريخ الانتهاء</span><span class="val">${m.end_date || 'غير محدد'}</span></div>
            </div>

            <span class="badge-curved ${statusClass}">${statusText}</span>

            <div class="card-actions-row">
              <button class="action-icon-btn" onclick="openRenewModal(${m.id})" title="تجديد الاشتراك"><i class="fa-solid fa-rotate-right"></i></button>
              <button class="action-icon-btn" onclick="editMember(${m.id})" title="تعديل"><i class="fa-solid fa-pen"></i></button>
              <button class="action-icon-btn" onclick="deleteMember(${m.id})" title="حذف"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }

    async function loadPlans() {
      try {
        const res = await fetch('/api/plans');
        globalPlans = await res.json();
        const container = document.getElementById('all-plans-list');
        const select = document.getElementById('member-plan');
        const renewSelect = document.getElementById('renew-plan-id');
        
        container.innerHTML = '';
        select.innerHTML = '<option value="">-- اختر الخطة --</option>';
        renewSelect.innerHTML = '<option value="">-- اختر الخطة --</option>';

        globalPlans.forEach(p => {
          container.innerHTML += `
            <div class="horizontal-card">
              <div class="member-info-col">
                <div class="member-name-txt">${p.name}</div>
                <div class="member-phone-txt"><i class="fa-solid fa-calendar-days"></i> المدة: ${p.duration_days} يوم</div>
              </div>
              <div style="font-weight:900; font-size:1.3rem; color:var(--accent-green);">${p.price} د.أ</div>
              <div class="card-actions-row">
                <button class="action-icon-btn" onclick="deletePlan(${p.id})" title="حذف الخطة"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          `;
          const opt = `<option value="${p.id}">${p.name} (${p.price} د.أ - ${p.duration_days} يوم)</option>`;
          select.innerHTML += opt;
          renewSelect.innerHTML += opt;
        });
      } catch (e) { console.error(e); }
    }

    function openMemberModal() {
      document.getElementById('member-id').value = '';
      document.getElementById('member-form').reset();
      document.getElementById('member-modal-title').innerText = 'إضافة مشترك جديد';
      document.getElementById('plan-select-group').style.display = 'flex';
      document.getElementById('date-select-group').style.display = 'flex';
      document.getElementById('member-start-date').valueAsDate = new Date();
      document.getElementById('member-modal').classList.add('active');
    }

    function editMember(id) {
      const m = globalMembers.find(x => x.id === id);
      if (!m) return;
      document.getElementById('member-id').value = m.id;
      document.getElementById('member-name').value = m.full_name;
      document.getElementById('member-phone').value = m.phone;
      document.getElementById('member-notes').value = m.notes || '';
      document.getElementById('member-modal-title').innerText = 'تعديل بيانات العضو';
      document.getElementById('plan-select-group').style.display = 'none';
      document.getElementById('date-select-group').style.display = 'none';
      document.getElementById('member-modal').classList.add('active');
    }

    function openRenewModal(memberId) {
      document.getElementById('renew-member-id').value = memberId;
      document.getElementById('renew-start-date').valueAsDate = new Date();
      document.getElementById('renew-modal').classList.add('active');
    }

    function openPlanModal() {
      document.getElementById('plan-form').reset();
      document.getElementById('plan-modal').classList.add('active');
    }

    async function handleMemberSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('member-id').value;
      const body = {
        full_name: document.getElementById('member-name').value,
        phone: document.getElementById('member-phone').value,
        notes: document.getElementById('member-notes').value,
        plan_id: document.getElementById('member-plan').value,
        start_date: document.getElementById('member-start-date').value
      };

      const url = id ? '/api/members/' + id : '/api/members';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('member-modal');
      loadAllData();
    }

    async function handleRenewSubmit(e) {
      e.preventDefault();
      const body = {
        member_id: document.getElementById('renew-member-id').value,
        plan_id: document.getElementById('renew-plan-id').value,
        start_date: document.getElementById('renew-start-date').value
      };

      await fetch('/api/subscriptions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('renew-modal');
      loadAllData();
    }

    async function handlePlanSubmit(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('plan-name').value,
        price: document.getElementById('plan-price').value,
        duration_days: document.getElementById('plan-duration').value,
        active: 1
      };

      await fetch('/api/plans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('plan-modal');
      loadPlans();
    }

    async function deleteMember(id) {
      if (!confirm('هل أنت متأكد من حذف هذا العضو؟')) return;
      await fetch('/api/members/' + id, { method: 'DELETE' });
      loadAllData();
    }

    async function deletePlan(id) {
      if (!confirm('هل أنت متأكد من حذف هذه الخطة؟')) return;
      await fetch('/api/plans/' + id, { method: 'DELETE' });
      loadPlans();
    }

    loadAllData();
  </script>
</body>
</html>
