<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نظام إدارة الجيم الاحترافي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #22c55e;
      --accent-danger: #ef4444;
      --accent-warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(var(--nav-height) + 30px);
      -webkit-overflow-scrolling: touch;
    }

    main::-webkit-scrollbar { display: none; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-card .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .stat-card.members .icon { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .stat-card.active .icon { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .stat-card.expiring .icon { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .stat-card.expired .icon { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .stat-card .value { font-size: 1.5rem; font-weight: 800; }
    .stat-card .label { font-size: 0.8rem; color: var(--text-muted); }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 16px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      width: 100%;
      margin-bottom: 12px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      padding-right: 42px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info { display: flex; flex-direction: column; gap: 4px; }
    .item-title { font-size: 0.95rem; font-weight: 700; }
    .item-subtitle { font-size: 0.8rem; color: var(--text-muted); }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge.Active { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge.Expiring { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge.Expired { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge.NoSub { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    .actions { display: flex; gap: 8px; }
    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-edit { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .btn-delete { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      width: 33%;
    }

    .nav-item i { font-size: 1.2rem; }
    .nav-item.active { color: var(--primary); font-weight: 700; }

    .fab-btn {
      position: fixed;
      bottom: calc(var(--nav-height) + 16px);
      left: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      border: none;
      cursor: pointer;
      z-index: 90;
    }

    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.2s ease-in-out; }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 10px 14px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: white;
      outline: none;
    }

    .btn-submit {
      padding: 12px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-dumbbell"></i> أيرون كور جيم</h1>
    <div style="font-size: 0.8rem; color: var(--text-muted);">عمان (الأردن)</div>
  </header>

  <main>
    <!-- الرئيسية -->
    <section id="page-dashboard" class="page active">
      <div class="stats-grid">
        <div class="stat-card members">
          <div class="icon"><i class="fa-solid fa-users"></i></div>
          <div class="value" id="stat-members">0</div>
          <div class="label">إجمالي الأعضاء</div>
        </div>
        <div class="stat-card active">
          <div class="icon"><i class="fa-solid fa-bolt"></i></div>
          <div class="value" id="stat-active">0</div>
          <div class="label">اشتراكات سارية</div>
        </div>
        <div class="stat-card expiring">
          <div class="icon"><i class="fa-solid fa-hourglass-half"></i></div>
          <div class="value" id="stat-expiring">0</div>
          <div class="label">تنتهي قريباً</div>
        </div>
        <div class="stat-card expired">
          <div class="icon"><i class="fa-solid fa-circle-exclamation"></i></div>
          <div class="value" id="stat-expired">0</div>
          <div class="label">منتهية</div>
        </div>
      </div>

      <div class="section-title">آخر الاشتراكات المضافة</div>
      <div class="list-container" id="recent-subscriptions-list"></div>
    </section>

    <!-- الأعضاء -->
    <section id="page-members" class="page">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="member-search" placeholder="ابحث عن عضو بالإسم أو الهاتف..." oninput="filterMembers()">
      </div>
      <div class="list-container" id="all-members-list"></div>
    </section>

    <!-- الخطط -->
    <section id="page-plans" class="page">
      <div class="section-title">
        <span>الخطط والرياضات</span>
        <button class="badge Active" onclick="openPlanModal()" style="border:none; cursor:pointer;">+ إضافة خطة</button>
      </div>
      <div class="list-container" id="all-plans-list"></div>
    </section>
  </main>

  <button class="fab-btn" onclick="openMemberModal()"><i class="fa-solid fa-plus"></i></button>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('dashboard', this)">
      <i class="fa-solid fa-chart-pie"></i>
      <span>الرئيسية</span>
    </div>
    <div class="nav-item" onclick="switchTab('members', this)">
      <i class="fa-solid fa-id-card"></i>
      <span>الأعضاء</span>
    </div>
    <div class="nav-item" onclick="switchTab('plans', this)">
      <i class="fa-solid fa-layer-group"></i>
      <span>الخطط</span>
    </div>
  </nav>

  <!-- مودال إضافة/تعديل عضو -->
  <div class="modal" id="member-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="member-modal-title">إضافة مشترك جديد</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('member-modal')"></i>
      </div>
      <form id="member-form" onsubmit="handleMemberSubmit(event)">
        <input type="hidden" id="member-id">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="member-name" required placeholder="مثال: محمد أحمد">
        </div>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="tel" id="member-phone" required placeholder="079XXXXXXXX">
        </div>
        <div class="form-group">
          <label>ملاحظات</label>
          <textarea id="member-notes" rows="2" placeholder="ملاحظات اختيارية..."></textarea>
        </div>
        <div class="form-group" id="plan-select-group">
          <label>خطة الاشتراك (اختياري)</label>
          <select id="member-plan"></select>
        </div>
        <div class="form-group" id="date-select-group">
          <label>تاريخ البدء</label>
          <input type="date" id="member-start-date">
        </div>
        <button type="submit" class="btn-submit">حفظ البيانات</button>
      </form>
    </div>
  </div>

  <!-- مودال إضافة خطة -->
  <div class="modal" id="plan-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>إضافة خطة رياضية</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('plan-modal')"></i>
      </div>
      <form id="plan-form" onsubmit="handlePlanSubmit(event)">
        <div class="form-group">
          <label>اسم الرياضة / الخطة</label>
          <input type="text" id="plan-name" required placeholder="مثال: ملاكمة">
        </div>
        <div class="form-group">
          <label>السعر (دينار)</label>
          <input type="number" id="plan-price" required step="0.5" placeholder="20">
        </div>
        <div class="form-group">
          <label>المدة (بالأيام)</label>
          <input type="number" id="plan-duration" required value="30">
        </div>
        <button type="submit" class="btn-submit">حفظ الخطة</button>
      </form>
    </div>
  </div>

  <script>
    let globalMembers = [];
    let globalPlans = [];

    function switchTab(pageId, element) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active');
      element.classList.add('active');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function loadAllData() {
      await loadDashboard();
      await loadMembers();
      await loadPlans();
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/dashboard/stats');
        const data = await res.json();
        document.getElementById('stat-members').innerText = data.totalMembers || 0;
        document.getElementById('stat-active').innerText = data.totalActive || 0;
        document.getElementById('stat-expiring').innerText = data.totalExpiring || 0;
        document.getElementById('stat-expired').innerText = data.totalExpired || 0;

        const container = document.getElementById('recent-subscriptions-list');
        container.innerHTML = '';
        (data.recentSubscriptions || []).forEach(s => {
          container.innerHTML += `
            <div class="item-card">
              <div class="item-info">
                <div class="item-title">${s.member_name}</div>
                <div class="item-subtitle">${s.plan_name} - ${s.price} دينار</div>
              </div>
              <span class="badge ${s.status}">${s.status === 'Active' ? 'نشط' : (s.status === 'Expiring Soon' ? 'قريب الانتهاء' : 'منتهي')}</span>
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    }

    async function loadMembers() {
      try {
        const res = await fetch('/api/members');
        globalMembers = await res.json();
        renderMembers(globalMembers);
      } catch (e) { console.error(e); }
    }

    function renderMembers(list) {
      const container = document.getElementById('all-members-list');
      container.innerHTML = '';
      list.forEach(m => {
        const statusClass = m.status === 'Active' ? 'Active' : (m.status === 'Expiring Soon' ? 'Expiring' : (m.status === 'Expired' ? 'Expired' : 'NoSub'));
        const statusText = m.status === 'Active' ? 'نشط' : (m.status === 'Expiring Soon' ? 'قريب الانتهاء' : (m.status === 'Expired' ? 'منتهي' : 'بدون اشتراك'));
        
        container.innerHTML += `
          <div class="item-card">
            <div class="item-info">
              <div class="item-title">${m.full_name}</div>
              <div class="item-subtitle"><i class="fa-solid fa-phone"></i> ${m.phone}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="badge ${statusClass}">${statusText}</span>
              <div class="actions">
                <button class="btn-icon btn-delete" onclick="deleteMember(${m.id})"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterMembers() {
      const q = document.getElementById('member-search').value.toLowerCase();
      const filtered = globalMembers.filter(m => m.full_name.toLowerCase().includes(q) || m.phone.includes(q));
      renderMembers(filtered);
    }

    async function loadPlans() {
      try {
        const res = await fetch('/api/plans');
        globalPlans = await res.json();
        const container = document.getElementById('all-plans-list');
        const select = document.getElementById('member-plan');
        container.innerHTML = '';
        select.innerHTML = '<option value="">-- اختر الخطة --</option>';

        globalPlans.forEach(p => {
          container.innerHTML += `
            <div class="item-card">
              <div class="item-info">
                <div class="item-title">${p.name}</div>
                <div class="item-subtitle">${p.duration_days} يوم</div>
              </div>
              <div style="font-weight:800; color:var(--accent);">${p.price} دينار</div>
            </div>
          `;
          select.innerHTML += `<option value="${p.id}">${p.name} (${p.price} دينار)</option>`;
        });
      } catch (e) { console.error(e); }
    }

    function openMemberModal() {
      document.getElementById('member-form').reset();
      document.getElementById('member-start-date').valueAsDate = new Date();
      document.getElementById('member-modal').classList.add('active');
    }

    function openPlanModal() {
      document.getElementById('plan-form').reset();
      document.getElementById('plan-modal').classList.add('active');
    }

    async function handleMemberSubmit(e) {
      e.preventDefault();
      const body = {
        full_name: document.getElementById('member-name').value,
        phone: document.getElementById('member-phone').value,
        notes: document.getElementById('member-notes').value,
        plan_id: document.getElementById('member-plan').value,
        start_date: document.getElementById('member-start-date').value
      };

      await fetch('/api/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('member-modal');
      loadAllData();
    }

    async function handlePlanSubmit(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('plan-name').value,
        price: document.getElementById('plan-price').value,
        duration_days: document.getElementById('plan-duration').value,
        active: 1
      };

      await fetch('/api/plans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal('plan-modal');
      loadPlans();
    }

    async function deleteMember(id) {
      if (!confirm('هل انت متأكد من حذف هذا العضو؟')) return;
      await fetch('/api/members/' + id, { method: 'DELETE' });
      loadAllData();
    }

    loadAllData();
  </script>
</body>
</html>
